name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверка проекта Django
        run: python manage.py check

      - name: Валидация контента
        run: python validate_content.py

      - name: Проверка кода-примеров в уроках
        run: python check_code_samples.py

      - name: Миграции и наполнение БД
        run: |
          python manage.py migrate
          python manage.py load_content
          python manage.py seed_achievements

      - name: Смоук-тест страниц
        run: python smoke_test.py

      - name: Юнит-тесты
        run: python manage.py test
