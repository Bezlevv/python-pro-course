{% extends 'base.html' %}
{% block title %}Вход — PythonПро{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container auth-container">
    <div class="card auth-card">
      <h1>Вход</h1>
      <p class="muted">Войдите, чтобы отмечать пройденные уроки.</p>
      <form method="post" class="form-stack">
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div class="alert alert-error">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="field">
          <label for="id_username">Имя пользователя</label>
          <input type="text" name="username" id="id_username" autofocus required>
        </div>
        <div class="field">
          <label for="id_password">Пароль</label>
          <input type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-lg" type="submit">Войти</button>
      </form>
      <p class="auth-alt">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
  </div>
</section>
{% endblock %}
