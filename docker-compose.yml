services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "change-me-to-a-long-random-string"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Для полного стека (postgres + redis) раскомментируй и запускай: docker compose --profile full up
      # DJANGO_DB_ENGINE: "postgresql"
      # DJANGO_DB_NAME: "pythonpro"
      # DJANGO_DB_USER: "pythonpro"
      # DJANGO_DB_PASSWORD: "pythonpro"
      # DJANGO_DB_HOST: "db"
      # DJANGO_REDIS_URL: "redis://redis:6379/1"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_content &&
             python manage.py seed_achievements &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 courseproj.wsgi:application"

  db:
    image: postgres:17
    profiles: ["full"]
    environment:
      POSTGRES_DB: pythonpro
      POSTGRES_USER: pythonpro
      POSTGRES_PASSWORD: pythonpro
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: ["full"]

volumes:
  pgdata:
